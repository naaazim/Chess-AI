<!DOCTYPE html>
<html lang="fr" data-theme="dark">
<head>
    <script>
        (function(){var t=localStorage.getItem('db-theme');document.documentElement.setAttribute('data-theme',t==='light'?'light':'dark');}());
    </script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Documentation - DEEP BLACK</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;1,9..40,400&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <style>

        /* ── VARIABLES ── */
        [data-theme="dark"] {
            --bg:        #080808;
            --bg-card:   #0e0e0e;
            --bg-hover:  #161616;
            --bg-active: #1e1e1e;
            --border:    rgba(255,255,255,0.065);
            --border-h:  rgba(255,255,255,0.13);
            --text:      #f0f0f0;
            --text-2:    #909090;
            --text-3:    #3e3e3e;
            --accent:    #fff;
            --acc-inv:   #000;
            --mono:      #7eb8f7;
            --mono-bg:   #0d1b2e;
            --grid:      rgba(255,255,255,0.018);
            --badge-class-bg:#071a08;  --badge-class-c:#4ade80;
            --badge-enum-bg:#1a0f00;   --badge-enum-c:#fb923c;
            --badge-iface-bg:#080820;  --badge-iface-c:#818cf8;
            --badge-rec-bg:#120820;    --badge-rec-c:#c084fc;
            --badge-exc-bg:#1a0808;    --badge-exc-c:#f87171;
        }
        [data-theme="light"] {
            --bg:        #f5f5f3;
            --bg-card:   #ffffff;
            --bg-hover:  #ececec;
            --bg-active: #e4e4e4;
            --border:    rgba(0,0,0,0.07);
            --border-h:  rgba(0,0,0,0.15);
            --text:      #111111;
            --text-2:    #3d3d3d;
            --text-3:    #a0a0a0;
            --accent:    #0f0f0f;
            --acc-inv:   #fff;
            --mono:      #0550ae;
            --mono-bg:   #eef4ff;
            --grid:      rgba(0,0,0,0.025);
            --badge-class-bg:#dcfce7;  --badge-class-c:#15803d;
            --badge-enum-bg:#ffedd5;   --badge-enum-c:#c2410c;
            --badge-iface-bg:#e0e7ff;  --badge-iface-c:#4338ca;
            --badge-rec-bg:#f3e8ff;    --badge-rec-c:#7e22ce;
            --badge-exc-bg:#fee2e2;    --badge-exc-c:#b91c1c;
        }

        /* ── BASE ── */
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
        html { height: 100%; -webkit-font-smoothing: antialiased; }
        body {
            font-family: 'DM Sans', -apple-system, sans-serif;
            font-size: 15px;
            background: var(--bg); color: var(--text);
            height: 100%; display: flex; flex-direction: column; overflow: hidden;
        }
        a { color: inherit; text-decoration: none; }
        ::selection { background: var(--accent); color: var(--acc-inv); }

        ::-webkit-scrollbar { width: 4px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: var(--border-h); border-radius: 2px; }

        code {
            font-family: 'JetBrains Mono', monospace;
            font-size: .82em;
            background: var(--mono-bg);
            padding: 2px 6px; border-radius: 5px;
            color: var(--mono);
            letter-spacing: -.01em;
        }

        /* ── NAVBAR ── */
        .nav {
            flex-shrink: 0; height: 52px;
            display: flex; align-items: center; justify-content: space-between;
            padding: 0 20px;
            background: var(--bg-card);
            border-bottom: 1px solid var(--border);
            z-index: 200;
        }
        .nav-left  { display: flex; align-items: center; gap: 6px; min-width: 0; }
        .nav-back {
            display: flex; align-items: center; gap: 5px;
            font-size: 13px; font-weight: 400; color: var(--text-2);
            padding: 5px 8px; border-radius: 7px;
            transition: background 130ms, color 130ms; white-space: nowrap;
        }
        .nav-back:hover { background: var(--bg-hover); color: var(--text); }
        .nav-back svg { width: 13px; height: 13px; }
        .nav-sep { color: var(--border-h); font-size: 16px; user-select: none; flex-shrink: 0; }
        .nav-cur {
            font-family: 'Space Grotesk', sans-serif;
            font-size: 13px; font-weight: 600; color: var(--text);
            overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
        }
        .nav-right { display: flex; align-items: center; gap: 8px; flex-shrink: 0; }

        .theme-btn {
            width: 34px; height: 34px;
            display: flex; align-items: center; justify-content: center;
            border-radius: 8px; border: 1px solid var(--border-h);
            background: transparent; cursor: pointer; color: var(--text-2);
            transition: background 130ms, color 130ms;
        }
        .theme-btn:hover { background: var(--bg-hover); color: var(--text); }
        .theme-btn svg { width: 15px; height: 15px; }
        .icon-sun  { display: none; }
        .icon-moon { display: block; }
        [data-theme="light"] .icon-sun  { display: block; }
        [data-theme="light"] .icon-moon { display: none; }

        .menu-btn {
            display: none; align-items: center; justify-content: center;
            width: 34px; height: 34px; border-radius: 8px;
            border: 1px solid var(--border-h); background: transparent;
            cursor: pointer; color: var(--text-2);
            transition: background 130ms;
        }
        .menu-btn:hover { background: var(--bg-hover); color: var(--text); }
        .menu-btn svg { width: 15px; height: 15px; }
        @media (max-width: 720px) { .menu-btn { display: flex; } }

        /* ── LAYOUT ── */
        .layout { flex: 1; display: flex; overflow: hidden; min-height: 0; }

        /* ── SIDEBAR ── */
        .sidebar {
            width: 256px; flex-shrink: 0;
            background: var(--bg-card);
            border-right: 1px solid var(--border);
            display: flex; flex-direction: column; overflow: hidden;
        }
        @media (max-width: 720px) {
            .sidebar {
                position: fixed; top: 52px; left: 0; bottom: 0; z-index: 150;
                transform: translateX(-100%);
                transition: transform 240ms cubic-bezier(0.16,1,0.3,1);
                box-shadow: 4px 0 28px rgba(0,0,0,0.35);
            }
            .sidebar.open { transform: translateX(0); }
        }

        .sb-head {
            padding: 16px 16px 12px;
            border-bottom: 1px solid var(--border);
            flex-shrink: 0;
        }
        .sb-brand {
            font-family: 'Space Grotesk', sans-serif;
            font-size: 9px; font-weight: 700; letter-spacing: .2em;
            text-transform: uppercase; color: var(--text-3); margin-bottom: 3px;
        }
        .sb-title {
            font-family: 'Space Grotesk', sans-serif;
            font-size: 13px; font-weight: 600; color: var(--text);
        }

        .sb-search { padding: 10px 10px; border-bottom: 1px solid var(--border); flex-shrink: 0; position: relative; }
        .sb-search-ico {
            position: absolute; left: 19px; top: 50%; transform: translateY(-50%);
            width: 13px; height: 13px; color: var(--text-3); pointer-events: none;
        }
        .sb-input {
            width: 100%; background: var(--bg-hover);
            border: 1px solid var(--border); border-radius: 8px;
            padding: 7px 8px 7px 30px;
            font-size: 13px; font-family: 'DM Sans', sans-serif;
            color: var(--text); outline: none;
            transition: border-color 130ms;
        }
        .sb-input::placeholder { color: var(--text-3); }
        .sb-input:focus { border-color: var(--border-h); }

        .sb-nav { flex: 1; overflow-y: auto; padding: 8px 0 24px; }

        .pkg-grp { margin-bottom: 2px; }
        .pkg-toggle {
            display: flex; align-items: center; justify-content: space-between;
            padding: 10px 14px 6px; cursor: pointer; user-select: none;
        }
        .pkg-name {
            font-family: 'Space Grotesk', sans-serif;
            font-size: 11px; font-weight: 600; letter-spacing: .08em;
            text-transform: uppercase; color: var(--text-2);
            white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
            max-width: 180px;
        }
        .pkg-chev { width: 9px; height: 9px; color: var(--text-3); transition: transform 160ms; flex-shrink: 0; }
        .pkg-grp.open .pkg-chev { transform: rotate(90deg); }
        .pkg-grp.open .pkg-name { color: var(--text); }
        .pkg-cls { display: none; padding: 2px 0; }
        .pkg-grp.open .pkg-cls { display: block; }

        .cls-item {
            display: flex; align-items: center; gap: 8px;
            padding: 5px 12px 5px 20px;
            font-size: 13px; font-weight: 400; color: var(--text-2);
            cursor: pointer; border-radius: 7px; margin: 1px 6px;
            transition: background 100ms, color 100ms;
            white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
        }
        .cls-item:hover { background: var(--bg-hover); color: var(--text); }
        .cls-item.active {
            background: var(--bg-active); color: var(--text); font-weight: 500;
        }
        .cls-dot {
            width: 5px; height: 5px; border-radius: 50%;
            background: var(--text-2); flex-shrink: 0; opacity: 0;
            transition: opacity 150ms;
        }
        .cls-item.active .cls-dot { opacity: 1; background: var(--accent); }
        .cls-item.hidden { display: none; }

        /* ── CONTENT ── */
        .content {
            flex: 1; overflow-y: auto;
            padding: 52px 68px;
            background: var(--bg);
            background-image:
                linear-gradient(var(--grid) 1px, transparent 1px),
                linear-gradient(90deg, var(--grid) 1px, transparent 1px);
            background-size: 48px 48px;
        }
        @media (max-width: 960px) { .content { padding: 32px 24px; } }

        /* ── HOME PAGE ── */
        .doc-home { max-width: 720px; }
        .doc-home-title {
            font-family: 'Space Grotesk', sans-serif;
            font-size: 34px; font-weight: 700; letter-spacing: -.04em;
            color: var(--text); margin-bottom: 10px;
        }
        .doc-home-sub {
            font-size: 15px; color: var(--text-2);
            line-height: 1.8; margin-bottom: 40px;
        }

        .pkg-table { width: 100%; border-collapse: collapse; font-size: 14px; }
        .pkg-table th {
            text-align: left; padding: 8px 14px;
            font-family: 'Space Grotesk', sans-serif;
            font-size: 10px; font-weight: 700; letter-spacing: .1em; text-transform: uppercase;
            color: var(--text-3); background: var(--bg-card); border-bottom: 1px solid var(--border);
        }
        .pkg-table td {
            padding: 12px 14px; border-bottom: 1px solid var(--border);
            vertical-align: top; line-height: 1.6;
        }
        .pkg-table td:first-child {
            font-family: 'JetBrains Mono', monospace;
            font-size: 12px; color: var(--text-2); white-space: nowrap;
        }
        .pkg-table td:last-child { color: var(--text-3); font-size: 12px; white-space: nowrap; }
        .pkg-table tr { cursor: pointer; transition: background 100ms; }
        .pkg-table tr:hover td { background: var(--bg-hover); }

        /* ── CLASS PAGE ── */
        @keyframes classIn { from { opacity:0; transform:translateY(10px) } to { opacity:1; transform:none } }
        @keyframes rowIn   { from { opacity:0; transform:translateX(-6px) } to { opacity:1; transform:none } }
        .class-page { max-width: 860px; animation: classIn 200ms cubic-bezier(0.16,1,0.3,1) both; }

        .dt tbody tr {
            animation: rowIn 260ms cubic-bezier(0.16,1,0.3,1) both;
        }
        .dt tbody tr:nth-child(1)  { animation-delay:  40ms }
        .dt tbody tr:nth-child(2)  { animation-delay:  70ms }
        .dt tbody tr:nth-child(3)  { animation-delay: 100ms }
        .dt tbody tr:nth-child(4)  { animation-delay: 130ms }
        .dt tbody tr:nth-child(5)  { animation-delay: 160ms }
        .dt tbody tr:nth-child(6)  { animation-delay: 190ms }
        .dt tbody tr:nth-child(7)  { animation-delay: 220ms }
        .dt tbody tr:nth-child(8)  { animation-delay: 250ms }
        .dt tbody tr:nth-child(n+9){ animation-delay: 280ms }

        .class-crumb {
            font-family: 'JetBrains Mono', monospace;
            font-size: 11px; color: var(--text-3);
            margin-bottom: 14px; letter-spacing: .01em;
        }
        .class-hd {
            display: flex; align-items: baseline; gap: 12px;
            flex-wrap: wrap; margin-bottom: 6px;
        }
        .class-name {
            font-family: 'Space Grotesk', sans-serif;
            font-size: clamp(26px,3.5vw,40px); font-weight: 700;
            letter-spacing: -.04em; color: var(--text);
        }

        .badge {
            display: inline-flex; align-items: center;
            padding: 4px 12px; border-radius: 100px;
            font-family: 'Space Grotesk', sans-serif;
            font-size: 10px; font-weight: 700; letter-spacing: .06em;
            text-transform: uppercase; flex-shrink: 0;
        }
        .badge-class     { background: var(--badge-class-bg); color: var(--badge-class-c); }
        .badge-enum      { background: var(--badge-enum-bg);  color: var(--badge-enum-c); }
        .badge-interface { background: var(--badge-iface-bg); color: var(--badge-iface-c); }
        .badge-record    { background: var(--badge-rec-bg);   color: var(--badge-rec-c); }
        .badge-exception { background: var(--badge-exc-bg);   color: var(--badge-exc-c); }

        .class-decl {
            margin: 18px 0 22px;
            background: var(--bg-card);
            border-left: 2px solid var(--border-h);
            border-radius: 0 10px 10px 0;
            padding: 13px 18px;
            font-family: 'JetBrains Mono', monospace;
            font-size: 12.5px; color: var(--text-2);
            word-break: break-word; overflow-wrap: break-word; line-height: 1.6;
        }

        .class-desc {
            font-size: 15px; line-height: 1.88;
            color: var(--text); max-width: 740px;
            margin-bottom: 36px;
            font-weight: 400;
        }
        .class-desc code { font-size: .83em; }

        /* ── SECTIONS (champs/méthodes) ── */
        .cs { margin-bottom: 30px; }
        .cs-head {
            font-family: 'Space Grotesk', sans-serif;
            font-size: 10px; font-weight: 700; letter-spacing: .12em;
            text-transform: uppercase; color: var(--text-3);
            padding-bottom: 10px;
            border-bottom: 1px solid var(--border); margin-bottom: 12px;
        }

        .dt { width: 100%; border-collapse: collapse; font-size: 13px; }
        .dt th {
            text-align: left; padding: 7px 12px;
            font-family: 'Space Grotesk', sans-serif;
            font-size: 10px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase;
            color: var(--text-3); background: var(--bg-card); border-bottom: 1px solid var(--border);
        }
        .dt td {
            padding: 10px 12px; border-bottom: 1px solid var(--border);
            vertical-align: top; line-height: 1.7; color: var(--text);
        }
        .dt tr:hover td { background: var(--bg-hover); }

        .td-t {
            font-family: 'JetBrains Mono', monospace;
            font-size: 11.5px; color: var(--text-2); white-space: nowrap;
        }
        .td-n {
            font-family: 'JetBrains Mono', monospace;
            font-size: 11.5px; color: var(--mono);
        }
        .td-s {
            font-family: 'JetBrains Mono', monospace;
            font-size: 11.5px; color: var(--text-2); word-break: break-word; overflow-wrap: break-word; line-height: 1.6;
        }
        /* syntax colors */
        .sk { color: #818cf8; } /* keyword: void static int boolean … */
        .st { color: var(--mono); } /* type name */
        .sm { color: var(--text); } /* method name */
        .sp { color: var(--text); } /* punctuation */
        .sv { color: #fb923c; } /* value: null true false */
        /* also use for class-decl */
        .class-decl .sk { color: #818cf8; }
        .class-decl .st { color: var(--mono); }
        .class-decl .sm { color: var(--text); }

        /* ── DÉPENDANCES ── */
        .deps { display: flex; flex-wrap: wrap; gap: 7px; }
        .dep {
            background: var(--bg-card); border: 1px solid var(--border);
            border-radius: 7px; padding: 4px 12px;
            font-family: 'JetBrains Mono', monospace;
            font-size: 12px; color: var(--text-2); cursor: pointer;
            transition: background 130ms, color 130ms, border-color 130ms;
        }
        .dep:hover { background: var(--bg-active); color: var(--text); border-color: var(--border-h); }

        /* ── OVERLAY MOBILE ── */
        .mob-overlay {
            display: none; position: fixed; inset: 0; z-index: 140;
            background: rgba(0,0,0,0.55); backdrop-filter: blur(4px);
        }

    </style>
</head>
<body>

    <div class="nav-left">
        <button class="menu-btn" id="menuBtn">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/>

        <button class="theme-btn" id="themeBtn" aria-label="Thème">

<script>
    var PACKAGES=[
        {id:"plateau",name:"fr.moteurechecs.plateau",role:"Représentation bitboard, génération de coups, règles du jeu",classes:[
            {id:"Plateau",name:"Plateau",type:"class",pkg:"fr.moteurechecs.plateau",decl:"public final class Plateau",
                desc:"Classe centrale du moteur. Représente une position d'échecs à l'aide de douze bitboards <code>long</code> (un par type de pièce et couleur) et de quatre bitboards dérivés (occupés, blancs, noirs, vides). La convention d'indexation est 0 = a8, 63 = h1 (ligne 8 en haut). Le plateau maintient le trait, les droits de roque pour chaque camp et la case en passant. Les méthodes <code>jouerAvecSauvegarde</code> et <code>annuler</code> implémentent le schéma play/unplay utilisé par le générateur de coups légaux et la recherche alpha-bêta.",
                fields:[
                    {type:"long",name:"pionsBlancs, cavaliersBlancs, fousBlancs, toursBlanches, reineBlanche, roiBlanc",desc:"Six bitboards des pièces blanches."},
                    {type:"long",name:"pionsNoirs, cavaliersNoirs, fousNoirs, toursNoires, reineNoire, roiNoir",desc:"Six bitboards des pièces noires."},
                    {type:"long",name:"occupes, blancs, noirs, vides",desc:"Bitboards dérivés recalculés après chaque coup."},
                    {type:"Couleur",name:"trait",desc:"Joueur au trait (BLANC ou NOIR)."},
                    {type:"boolean",name:"roqueBlancRoi, roqueBlancReine, roqueNoirRoi, roqueNoirReine",desc:"Droits de roque par camp et côté."},
                    {type:"long",name:"enPassant",desc:"Bitboard de la case en passant cible (0 si aucune)."}
                ],
                methods:[
                    {sig:"static Plateau positionInitiale()",desc:"Crée le plateau en position initiale standard."},
                    {sig:"static Plateau depuisFEN(String fen)",desc:"Parse une chaîne FEN et retourne le plateau correspondant."},
                    {sig:"Plateau copie()",desc:"Retourne une copie profonde indépendante — utilisée pour la recherche parallèle."},
                    {sig:"EtatPlateau jouerAvecSauvegarde(Coup coup)",desc:"Joue le coup et retourne l'état complet avant le coup, permettant l'annulation."},
                    {sig:"void jouerSansSauvegarde(Coup coup)",desc:"Joue le coup sans allouer d'EtatPlateau. Plus rapide, utilisé quand l'annulation n'est pas nécessaire."},
                    {sig:"void annuler(EtatPlateau etat)",desc:"Restaure intégralement l'état du plateau tel qu'il était avant le coup."},
                    {sig:"long bitboard(Piece piece)",desc:"Retourne le bitboard correspondant au type de pièce donné."},
                    {sig:"Piece pieceEn(Case c)",desc:"Retourne la pièce occupant la case donnée, ou null si vide."},
                    {sig:"boolean estEnEchec(Couleur couleur)",desc:"Teste si le roi de la couleur donnée est actuellement en échec."},
                    {sig:"long casesAttaqueesPar(Couleur couleur)",desc:"Retourne le bitboard de toutes les cases attaquées par la couleur donnée."}
                ],
                deps:["Case","Coup","Piece","EtatPlateau","Couleur"]},

            {id:"VueEchiquier",name:"VueEchiquier",type:"class",pkg:"fr.moteurechecs.gui",decl:"public class VueEchiquier extends GridPane",
                desc:"Composant graphique JavaFX représentant l'échiquier 8×8. Construit une grille de StackPane, chacun contenant un fond coloré (clair #eceed1 / foncé #779556), une surbrillance optionnelle (sélection en vert-jaune, dernier coup en jaune pâle), l'image de la pièce avec ombre portée, et un cercle indicateur pour les coups légaux. Affiche les coordonnées algébriques sur les bords.",
                fields:[{type:"static final int",name:"TAILLE_CASE = 60",desc:"Taille en pixels du côté d'une case."}],

                    {sig:"void rafraichir(Plateau, Case, Coup, List<Coup>)",desc:"Redessine intégralement l'échiquier avec la position, la surbrillance et les indicateurs de coups."}
                ],deps:["ControleurPartieGUI","RessourcesPieces","Plateau","Case","Coup","Piece"]},
            {id:"StatistiquesPartie",name:"StatistiquesPartie",type:"class",pkg:"fr.moteurechecs.gui",decl:"public final class StatistiquesPartie",

                    {sig:"void marquerFinDePartie(String resultat)",desc:"Enregistre le résultat final de la partie."},
                    {sig:"void sauvegarderStatistiques(Stage fenetre)",desc:"Ouvre un FileChooser et sauvegarde le rapport texte dans le fichier choisi."}
                ],deps:["Niveau"]},
            {id:"RessourcesPieces",name:"RessourcesPieces",type:"class",pkg:"fr.moteurechecs.gui",decl:"public class RessourcesPieces",
                desc:"Gestionnaire de ressources graphiques pour les pièces. Charge les douze images PNG depuis le classpath au chargement de la classe (static initializer). Retourne un nœud JavaFX à la taille demandée. Affiche un texte '?' en fallback si une image est manquante.",
                fields:[{type:"static Map<Piece, Image>",name:"IMAGES",desc:"Cache des douze images de pièces, indexées par Piece."}],
                methods:[{sig:"Node getRepresentation(Piece piece, double tailleCase)",desc:"Retourne le nœud JavaFX représentant la pièce à la taille donnée, ou null pour une case vide."}],
                deps:["Piece"]},
            {id:"NotationEchecs",name:"NotationEchecs",type:"class",pkg:"fr.moteurechecs.gui",decl:"public final class NotationEchecs",
                desc:"Génère la notation algébrique standard (SAN) d'un coup dans le contexte d'une position donnée. Gère le roque (O-O / O-O-O), les captures (x), les promotions (=Q), la désambiguïsation (colonne ou ligne source si nécessaire), l'échec (+) et le mat (#).",
                fields:[],
                methods:[{sig:"static String versSAN(Plateau plateau, Coup coup, List<Coup> coupsLegaux)",desc:"Retourne la notation SAN du coup dans la position donnée."}],
                deps:["Plateau","Coup","Piece","Case","GenerateurCoups","Arbitre","Couleur"]},
            {id:"SelecteurCoup",name:"SelecteurCoup",type:"class",pkg:"fr.moteurechecs.gui",decl:"public class SelecteurCoup",
                desc:"Automate d'état pour la sélection de coup par un joueur humain. Deux états : aucune sélection (attente d'un premier clic valide) et case de départ sélectionnée (attente d'un clic d'arrivée). Filtre les coups légaux par la case de départ pour l'affichage des indicateurs. En cas de promotion, retourne tous les coups candidats pour que le contrôleur présente la boîte de dialogue.",
                fields:[
                    {type:"Case",name:"caseDepart",desc:"Case de départ actuellement sélectionnée, null si aucune sélection."},
                    {type:"List<Coup>",name:"coupsLegaux",desc:"Liste complète des coups légaux de la position courante."}
                ],
                methods:[
                    {sig:"void setCoupsLegaux(List<Coup> coups)",desc:"Met à jour la liste des coups légaux et réinitialise la sélection."},
                    {sig:"boolean selectionner(Case caseCliquee)",desc:"Traite un clic : sélectionne la case de départ si valide, ou passe à l'arrivée."},
                    {sig:"void reinitialiser()",desc:"Réinitialise la sélection courante."},
                    {sig:"List<Coup> getCoupsPossiblesSelection()",desc:"Retourne les coups légaux depuis la case sélectionnée (pour les indicateurs visuels)."},
                    {sig:"Coup trouverCoup(Case arrivee)",desc:"Retourne le coup unique ou, en cas de promotion, préfère la dame par défaut."}
                ],deps:["Case","Coup","Piece"]}

    /* ── UTILITAIRES ── */
    function esc(s){ return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

    /* ── SYNTAX HIGHLIGHTING (signatures Java) ── */
    var JAVA_KW = /\b(void|static|final|public|private|protected|int|long|double|float|boolean|byte|char|short|new|return|null|true|false|extends|implements|throws|class|interface|enum|record)\b/g;
    /* For signatures: exclude declaration keywords that appear in HTML attr strings */
    var JAVA_SIG_KW = /\b(void|static|final|public|private|protected|int|long|double|float|boolean|byte|char|short|new|return|null|true|false|extends|implements|throws)\b/g;
    var JAVA_TYPES = /\b(String|List|Map|Set|Optional|Consumer|AtomicBoolean|Plateau|Coup|Case|Piece|Couleur|Niveau|EtatPlateau|Stage|Node|Image|ResultatIDS|ResultatRecherche|EntreeTT|EtatTournoi|ClePosition|BookCandidate|PartiePGN|Scanner|BufferedWriter|Task|ObservableList|SimpleIntegerProperty|SimpleStringProperty)\b/g;

    function highlight(sig){
        if(!sig) return '';
        var s = esc(sig);
        /* method name — word before first '(' */
        s = s.replace(/(\w+)(\()/, function(m, name, paren){
            return '<span class="sm">'+name+'</span><span class="sp">(</span>';
        });
        /* keywords — use sig-safe regex (no 'class'/'interface' etc.) */
        s = s.replace(JAVA_SIG_KW, function(m){
            if(m==='null'||m==='true'||m==='false') return '<span class="sv">'+m+'</span>';
            return '<span class="sk">'+m+'</span>';
        });
        /* types */
        s = s.replace(JAVA_TYPES, '<span class="st">$&</span>');
        /* punctuation — only commas (never / which breaks </span> tags) */
        s = s.replace(/,/g, '<span class="sp">,</span>');
        return s;
    }

    function highlightDecl(decl){
        if(!decl) return '';
        var s = esc(decl);
        s = s.replace(JAVA_KW, function(m){
            return '<span class="sk">'+m+'</span>';
        });
        s = s.replace(JAVA_TYPES, '<span class="st">$&</span>');
        /* class/interface name (word after class/interface/enum/record keyword) */
        s = s.replace(/(<span class="sk">(?:class|interface|enum|record)<\/span>) (\w+)/, '$1 <span class="sm">$2</span>');
        return s;
    }

    /* ── SIDEBAR ── */
    function buildSidebar(){
        var nav = document.getElementById('sbNav');
        nav.innerHTML = '';
        PACKAGES.forEach(function(pkg){
            var grp = document.createElement('div');
            grp.className = 'pkg-grp'; grp.id = 'grp-' + pkg.id;
            var tog = document.createElement('div');
            tog.className = 'pkg-toggle';
            tog.innerHTML = '<span class="pkg-name">'+pkg.id+'</span><svg class="pkg-chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="9 18 15 12 9 6"/></svg>';
            tog.addEventListener('click', function(){ grp.classList.toggle('open'); });
            var cls = document.createElement('div');
            cls.className = 'pkg-cls';
            pkg.classes.forEach(function(c){
                var item = document.createElement('div');
                item.className = 'cls-item'; item.id = 'nav-' + c.id;
                item.innerHTML = '<span class="cls-dot"></span>' + esc(c.name);
                item.addEventListener('click', function(){ showClass(c.id); closeMobileMenu(); });
                cls.appendChild(item);
            });
            grp.appendChild(tog); grp.appendChild(cls); nav.appendChild(grp);
        });
    }

    /* ── HOME ── */
    function renderHome(){
        var total = PACKAGES.reduce(function(s,p){ return s+p.classes.length; },0);
        var rows = PACKAGES.map(function(pkg){
            return '<tr onclick="showPackage(\''+pkg.id+'\')">'+
                '<td>'+esc(pkg.name)+'</td>'+
                '<td>'+esc(pkg.role)+'</td>'+
                '<td style="text-align:right">'+pkg.classes.length+'</td></tr>';
        }).join('');
        return '<div class="doc-home">'+
            '<h1 class="doc-home-title">Documentation technique</h1>'+
            '<p class="doc-home-sub">Vue d\'ensemble des '+PACKAGES.length+' packages et '+total+
            ' classes du moteur d\'échecs DEEP BLACK, implémenté en Java 17 avec Maven.</p>'+
            '<table class="pkg-table"><thead><tr><th>Package</th><th>Rôle</th><th style="text-align:right">Classes</th></tr></thead>'+
            '<tbody>'+rows+'</tbody></table></div>';
    }

    /* ── RENDU CLASSE ── */
    function renderClass(cls){
        var fields = '';
        if(cls.fields && cls.fields.length){
            fields = '<div class="cs"><div class="cs-head">Champs</div>'+
                '<table class="dt"><thead><tr><th>Type</th><th>Nom</th><th>Description</th></tr></thead><tbody>'+
                cls.fields.map(function(f){
                    return '<tr><td class="td-t"><span class="sk">'+esc(f.type)+'</span></td><td class="td-n">'+esc(f.name)+'</td><td>'+f.desc+'</td></tr>';
                }).join('')+'</tbody></table></div>';
        }
        var methods = '';
        if(cls.methods && cls.methods.length){
            methods = '<div class="cs"><div class="cs-head">Méthodes publiques</div>'+
                '<table class="dt"><thead><tr><th>Signature</th><th>Description</th></tr></thead><tbody>'+
                cls.methods.map(function(m){
                    return '<tr><td class="td-s">'+highlight(m.sig)+'</td><td>'+m.desc+'</td></tr>';
                }).join('')+'</tbody></table></div>';
        }
        var deps = '';
        if(cls.deps && cls.deps.length){
            deps = '<div class="cs"><div class="cs-head">Dépendances</div><div class="deps">'+
                cls.deps.map(function(d){
                    return '<span class="dep" onclick="navigateTo(\''+esc(d)+'\')">'+esc(d)+'</span>';
                }).join('')+'</div></div>';
        }
        return '<div class="class-page">'+
            '<div class="class-crumb">'+esc(cls.pkg)+' / '+esc(cls.name)+'</div>'+
            '<div class="class-hd"><span class="class-name">'+esc(cls.name)+'</span>'+
            '<span class="badge badge-'+cls.type+'">'+cls.type+'</span></div>'+
            '<div class="class-decl">'+highlightDecl(cls.decl)+'</div>'+
            '<div class="class-desc">'+cls.desc+'</div>'+
            fields+methods+deps+'</div>';
    }

    /* ── NAVIGATION ── */
    function showHome(){
        document.getElementById('mainContent').innerHTML = renderHome();
        document.getElementById('mainContent').scrollTop = 0;
        document.getElementById('navCur').textContent = 'Documentation';
        document.querySelectorAll('.cls-item').forEach(function(el){ el.classList.remove('active'); });
        history.replaceState(null,'',window.location.pathname);
    }

    function showClass(id){
        var cls = null, pkgId = null;
        PACKAGES.forEach(function(pkg){
            pkg.classes.forEach(function(c){ if(c.id===id){ cls=c; pkgId=pkg.id; } });
        });
        if(!cls) return;
        document.getElementById('mainContent').innerHTML = renderClass(cls);
        document.getElementById('mainContent').scrollTop = 0;
        document.getElementById('navCur').textContent = cls.name;
        document.querySelectorAll('.cls-item').forEach(function(el){ el.classList.remove('active'); });
        var link = document.getElementById('nav-'+id);
        if(link){
            link.classList.add('active');
            var grp = document.getElementById('grp-'+pkgId);
            if(grp) grp.classList.add('open');
        }
        history.replaceState(null,'','#'+id);
    }

    function showPackage(pkgId){
        PACKAGES.forEach(function(pkg){
            if(pkg.id===pkgId && pkg.classes.length){ showClass(pkg.classes[0].id); }
        });
    }

    function navigateTo(name){
        PACKAGES.forEach(function(pkg){
            pkg.classes.forEach(function(c){ if(c.id===name||c.name===name) showClass(c.id); });
        });
    }

    /* ── RECHERCHE ── */
    document.getElementById('searchInput').addEventListener('input', function(){
        var q = this.value.toLowerCase().trim();
        PACKAGES.forEach(function(pkg){
            var grp = document.getElementById('grp-'+pkg.id);
            if(!grp) return;
            var any = false;
            pkg.classes.forEach(function(c){
                var el = document.getElementById('nav-'+c.id);
                if(!el) return;
                var ok = !q || c.name.toLowerCase().indexOf(q) >= 0;
                el.classList.toggle('hidden',!ok);
                if(ok) any = true;
            });
            grp.style.display = (any||!q) ? '' : 'none';
            if(q && any) grp.classList.add('open');
        });
    });

    /* ── MOBILE ── */
    function closeMobileMenu(){
        document.getElementById('sidebar').classList.remove('open');
        document.getElementById('mobOverlay').style.display = 'none';
    }
    document.getElementById('menuBtn').addEventListener('click', function(){
        var sb = document.getElementById('sidebar');
        var open = sb.classList.toggle('open');
        document.getElementById('mobOverlay').style.display = open ? 'block' : 'none';
    });
    document.getElementById('mobOverlay').addEventListener('click', closeMobileMenu);

    /* ── THÈME ── */
    (function(){
        var btn  = document.getElementById('themeBtn');
        var html = document.documentElement;
        var style = document.createElement('style');
        style.textContent = '::view-transition-old(root){z-index:1;animation:none;mix-blend-mode:normal}::view-transition-new(root){z-index:9999;animation:none;mix-blend-mode:normal}';
        document.head.appendChild(style);
        btn.addEventListener('click', function(){
            var cur = html.getAttribute('data-theme');
            var next = cur === 'dark' ? 'light' : 'dark';
            var r = btn.getBoundingClientRect();
            var x = Math.round(r.left + r.width/2);
            var y = Math.round(r.top + r.height/2);
            var radius = Math.ceil(Math.hypot(Math.max(x, innerWidth-x), Math.max(y, innerHeight-y)));
            if(document.startViewTransition){
                var t = document.startViewTransition(function(){
                    html.setAttribute('data-theme', next);
                    localStorage.setItem('db-theme', next);
                });
                t.ready.then(function(){
                    document.documentElement.animate(
                        { clipPath: ['circle(0px at '+x+'px '+y+'px)', 'circle('+radius+'px at '+x+'px '+y+'px)'] },
                        { duration: 600, easing: 'cubic-bezier(0.76,0,0.24,1)', pseudoElement: '::view-transition-new(root)' }
                    );
                });
            } else {
                html.setAttribute('data-theme', next);
                localStorage.setItem('db-theme', next);
            }
        });
    }());

    /* ── INIT ── */
    buildSidebar();
    var hash = window.location.hash.slice(1);
    if(hash){ showClass(hash); } else { showHome(); }
    window.addEventListener('hashchange', function(){
        var h = window.location.hash.slice(1);
        if(h){ showClass(h); } else { showHome(); }
    });
</script>
